<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel League 3D Offline</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r146/three.min.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
  color: white;
}

#menu {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.85);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

#menu input {
  padding: 10px;
  font-size: 18px;
  margin: 10px;
}

#menu button {
  padding: 12px 20px;
  font-size: 18px;
  cursor: pointer;
}

#score {
  position: absolute;
  top: 10px;
  right: 20px;
  background: rgba(0, 0, 0, 0.6);
  padding: 8px 14px;
  border-radius: 8px;
}

/* Mobile control styles */
#controls {
  position: absolute;
  bottom: 20px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  z-index: 5;
  pointer-events: none;
}

.control-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  color: white;
  border: 1px solid #fff;
  font-size: 24px;
  display: flex;
  justify-content: center;
  align-items: center;
  pointer-events: auto;
  touch-action: none;
}

.control-btn:active {
  background: rgba(255, 255, 255, 0.4);
}
</style>
</head>
<body>

<div id="menu">
  <h1>Pixel League 3D Offline</h1>
  <p>Enter cheat code (optional):</p>
  <input id="cheat" placeholder="type here" />
  <p>Select AI difficulty:</p>
  <select id="difficulty">
    <option value="0.004">Easy</option>
    <option value="0.006" selected>Medium</option>
    <option value="0.009">Hard</option>
  </select>
  <button onclick="startGame()">Start</button>
  <p style="margin-top:20px; font-size:14px;">Desktop: use W/A/S/D to drive, Shift to drift, Space to boost.</p>
  <p style="font-size:14px;">On mobile, use the on‑screen arrows.</p>
</div>

<div id="score">AI: 0 | You: 0</div>

<!-- On‑screen controls for touch devices -->
<div id="controls" style="display:none;">
  <div class="control-btn" id="left">←</div>
  <div class="control-btn" id="up">↑</div>
  <div class="control-btn" id="down">↓</div>
  <div class="control-btn" id="right">→</div>
  <div class="control-btn" id="jump" style="display:none;">⤴</div>
</div>

<script>
let scene, camera, renderer;
let car, aiCar, ball;
let keys = {};
let cheat = false;
let scoreAI = 0;
let scorePlayer = 0;
let aiAccel = 0.006; // default medium difficulty

const GRAVITY = 0.01;
const MAX_SPEED = 0.3;

function init() {
  scene = new THREE.Scene();

  // Immersive background
  const skyGeo = new THREE.SphereGeometry(100, 32, 32);
  const skyMat = new THREE.MeshBasicMaterial({
    color: 0x001133,
    side: THREE.BackSide,
  });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  scene.add(sky);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(5, 10, 7);
  scene.add(light);

  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);

  // Ground
  const groundGeo = new THREE.PlaneGeometry(20, 12);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x004400 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // Player car
  const carGeo = new THREE.BoxGeometry(0.8, 0.3, 1);
  const carMat = new THREE.MeshStandardMaterial({ color: 0xff44aa });
  car = new THREE.Mesh(carGeo, carMat);
  car.position.set(0, 0.15, 4);
  car.userData.vel = new THREE.Vector3();
  scene.add(car);

  // AI car
  const aiGeo = new THREE.BoxGeometry(0.8, 0.3, 1);
  const aiMat = new THREE.MeshStandardMaterial({ color: 0x44aaff });
  aiCar = new THREE.Mesh(aiGeo, aiMat);
  aiCar.position.set(0, 0.15, -4);
  aiCar.userData.vel = new THREE.Vector3();
  scene.add(aiCar);

  // Ball
  const ballGeo = new THREE.SphereGeometry(0.3, 16, 16);
  const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  ball = new THREE.Mesh(ballGeo, ballMat);
  ball.position.set(0, 0.3, 0);
  ball.userData.vel = new THREE.Vector3();
  scene.add(ball);

  camera.position.set(0, 4, 8);

  document.addEventListener('keydown', (e) => {
    keys[e.code] = true;
  });
  document.addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });

  // Setup mobile controls if touch device
  const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  if (isTouchDevice) {
    const controls = document.getElementById('controls');
    controls.style.display = 'flex';
    const mapping = {
      left: 'KeyA',
      right: 'KeyD',
      up: 'KeyW',
      down: 'KeyS',
      jump: 'Space',
    };
    Object.keys(mapping).forEach((id) => {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        keys[mapping[id]] = true;
      });
      btn.addEventListener('touchend', (e) => {
        e.preventDefault();
        keys[mapping[id]] = false;
      });
      btn.addEventListener('mousedown', () => {
        keys[mapping[id]] = true;
      });
      btn.addEventListener('mouseup', () => {
        keys[mapping[id]] = false;
      });
      btn.addEventListener('mouseleave', () => {
        keys[mapping[id]] = false;
      });
    });
  }

  animate();
}

function startGame() {
  cheat = document.getElementById('cheat').value.toLowerCase() === 'mason';
  // set AI acceleration from difficulty selection
  const sel = document.getElementById('difficulty');
  if (sel) {
    aiAccel = parseFloat(sel.value);
  }
  document.getElementById('menu').style.display = 'none';
  const jumpBtn = document.getElementById('jump');
  if (cheat && jumpBtn) {
    jumpBtn.style.display = 'block';
  }
}

function updateCar() {
  const vel = car.userData.vel;
  const dir = new THREE.Vector3();

  if (keys['KeyW']) {
    dir.set(0, 0, -1).applyQuaternion(car.quaternion);
    vel.addScaledVector(dir, 0.01);
  }
  if (keys['KeyS']) {
    dir.set(0, 0, 1).applyQuaternion(car.quaternion);
    vel.addScaledVector(dir, 0.008);
  }
  if (keys['KeyA']) car.rotation.y += 0.04;
  if (keys['KeyD']) car.rotation.y -= 0.04;

  if (cheat && keys['Space']) {
    vel.y += 0.02;
  }

  vel.y -= GRAVITY;
  vel.x *= 0.98;
  vel.z *= 0.98;

  const horiz = new THREE.Vector3(vel.x, 0, vel.z);
  if (horiz.length() > MAX_SPEED) {
    horiz.setLength(MAX_SPEED);
    vel.x = horiz.x;
    vel.z = horiz.z;
  }

  car.position.add(vel);

  if (car.position.y < 0.15) {
    car.position.y = 0.15;
    vel.y = 0;
  }

  car.position.x = Math.max(-9.5, Math.min(9.5, car.position.x));
  car.position.z = Math.max(-5.5, Math.min(5.5, car.position.z));
}

function updateAICar() {
  const vel = aiCar.userData.vel;
  const toBall = new THREE.Vector3().subVectors(ball.position, aiCar.position);
  toBall.y = 0;
  if (toBall.length() > 0.1) {
    toBall.normalize();
    vel.addScaledVector(toBall, aiAccel);
  }
  // friction
  vel.x *= 0.98;
  vel.z *= 0.98;
  // limit speed
  const horiz = new THREE.Vector3(vel.x, 0, vel.z);
  if (horiz.length() > MAX_SPEED * 0.8) {
    horiz.setLength(MAX_SPEED * 0.8);
    vel.x = horiz.x;
    vel.z = horiz.z;
  }
  if (vel.x !== 0 || vel.z !== 0) {
    const angle = Math.atan2(-vel.x, -vel.z);
    aiCar.rotation.y = angle;
  }
  vel.y -= GRAVITY;
  aiCar.position.add(vel);
  if (aiCar.position.y < 0.15) {
    aiCar.position.y = 0.15;
    vel.y = 0;
  }
  aiCar.position.x = Math.max(-9.5, Math.min(9.5, aiCar.position.x));
  aiCar.position.z = Math.max(-5.5, Math.min(5.5, aiCar.position.z));
}

function updateBall() {
  const vel = ball.userData.vel;
  vel.multiplyScalar(0.995);
  vel.y -= GRAVITY;
  ball.position.add(vel);
  if (ball.position.y < 0.3) {
    ball.position.y = 0.3;
    vel.y *= -0.6;
  }
  ball.position.x = Math.max(-9.5, Math.min(9.5, ball.position.x));
  ball.position.z = Math.max(-5.5, Math.min(5.5, ball.position.z));
}

function checkCollision() {
  // Player collision
  let dist = car.position.distanceTo(ball.position);
  if (dist < 0.9) {
    const dir = new THREE.Vector3().subVectors(ball.position, car.position).normalize();
    ball.userData.vel.addScaledVector(dir, 0.2);
  }
  // AI collision
  dist = aiCar.position.distanceTo(ball.position);
  if (dist < 0.9) {
    const dir2 = new THREE.Vector3().subVectors(ball.position, aiCar.position).normalize();
    ball.userData.vel.addScaledVector(dir2, 0.2);
  }
  // Goals
  if (ball.position.x < -10) {
    scorePlayer++;
    reset();
  }
  if (ball.position.x > 10) {
    scoreAI++;
    reset();
  }
  document.getElementById('score').innerText =
    'AI: ' + scoreAI + ' | You: ' + scorePlayer;
}

function reset() {
  car.position.set(0, 0.15, 4);
  car.userData.vel.set(0, 0, 0);
  aiCar.position.set(0, 0.15, -4);
  aiCar.userData.vel.set(0, 0, 0);
  ball.position.set(0, 0.3, 0);
  ball.userData.vel.set(0, 0, 0);
}

function animate() {
  requestAnimationFrame(animate);
  updateCar();
  updateAICar();
  updateBall();
  checkCollision();
  camera.lookAt(car.position);
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
</script>

</body>
</html>
